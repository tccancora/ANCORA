name: ÂNCORA - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # ============================================================================
  # ETAPA DE INTEGRAÇÃO CONTÍNUA (CI)
  # ============================================================================
  ci:
    name: CI - Sintaxe e Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código-Fonte (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Ambiente PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validar Sintaxe de Todos os Arquivos PHP (PHP Lint)
        run: php ancora/tests/validate_syntax.php

      - name: Executar Suíte de Testes Automatizados do ÂNCORA
        run: php ancora/tests/run_all_tests.php

  # ============================================================================
  # ETAPA DE IMPLANTAÇÃO E ENTREGA CONTÍNUA (CD)
  # Executada APENAS se o job 'ci' for aprovado com 100% de sucesso.
  # ============================================================================
  cd:
    name: CD - Geração e Empacotamento de Artefato Seguro
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Baixar Código-Fonte (Checkout)
        uses: actions/checkout@v4

      - name: Gerar Pacote de Implantação Limpo (ZIP)
        run: |
          echo "Empacotando projeto ÂNCORA sem arquivos sensíveis..."
          zip -r ancora-release.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x ".env*" \
            -x "storage/logs/*.log" \
            -x "storage/logs/*/*.log"

      - name: Fazer Upload do Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ancora-build-release
          path: ancora-release.zip
          retention-days: 7
